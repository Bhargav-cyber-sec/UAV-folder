# Event ontology — edit thresholds here, not in code.
# See docs/design_review.md section 1 for rationale.

mission_phases:
  - takeoff
  - transit
  - loiter_observation
  - engagement_area
  - rtb
  - landing

event_types:
  - id: object_appearance
    trigger: new_track_id
    min_persistence_s: 1.5

  - id: object_persistence
    trigger: track_duration
    min_persistence_s: 5.0

  - id: object_disappearance
    trigger: track_ended

  - id: count_change
    trigger: class_count_delta
    min_delta: 1

  - id: scene_transition
    trigger: ssim_drop_or_camera_motion_spike

  - id: speech_event
    trigger: vad_segment_with_transcript

  - id: mission_phase_change
    trigger: manual_or_heuristic

# Sampling / inference settings (Phase 3+)
sampling:
  detection_fps: 3          # frames per second sampled for YOLO/tracking
  yolo_inference_size: 640  # px, letterboxed from 1920x1080

# Scoring weights (Phase 4) — hand-tuned starting point, not learned.
scoring:
  weights:
    yolo_relevance: 0.25
    persistence_norm: 0.2
    visual_change_norm: 0.15
    audio_relevance: 0.15
    mission_phase_weight: 0.15
    count_change_norm: 0.1
  candidate_threshold: 0.4

# Highlight generation (Phase 5)
highlight:
  pre_context_s: [3, 10]     # min, max — scales with event score
  post_context_s: [3, 15]
  merge_gap_s: 2.0
  min_clip_duration_s: 4.0
  max_clip_duration_s: 45.0
  always_include_mission_start_s: 5
  always_include_mission_end_s: 5
